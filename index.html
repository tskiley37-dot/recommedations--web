<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - WatchGuide</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top left, #302060, transparent 40%),
                radial-gradient(circle at bottom right, #163b5c, transparent 40%),
                #090912;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 24px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9999a8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c9c9d5;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            outline: none;
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #8d6cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            color: #ff8d8d;
            min-height: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #aaaabd;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <p class="subtitle">
        Sign in to manage recommendations
    </p>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
        ← Back to website
    </a>

</div>

<script>
    /*
       Supabase connection will be added next.
       Do not change anything here yet.
    */

    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        document.getElementById("message").textContent =
            "Supabase login will be connected next.";
    });
</script>

</body>
</html>
